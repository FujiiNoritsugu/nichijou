<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>検索 — 日乗</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN",
                   "Noto Sans JP", Meiryo, sans-serif;
      max-width: 680px;
      margin: 2.5rem auto;
      padding: 0 1rem;
      line-height: 1.7;
    }
    h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.1em; margin: 0 0 0.4rem; opacity: 0.7; }
    .nav { font-size: 0.8rem; opacity: 0.55; margin-bottom: 1.6rem; }
    .nav a { color: inherit; }
    form.search { margin-bottom: 1.4rem; }
    .search input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.35rem 0.6rem;
      font: inherit;
      font-size: 0.85rem;
      border: 1px solid rgba(128,128,128,0.3);
      border-radius: 6px;
      background: transparent;
      color: inherit;
    }
    .count { font-size: 0.8rem; opacity: 0.55; margin: 0 0 0.4rem; }
    ul.entries { list-style: none; padding: 0; margin: 0; }
    li.entry {
      padding: 0.9rem 0;
      border-top: 1px solid rgba(128,128,128,0.25);
    }
    .meta { font-size: 0.8rem; opacity: 0.55; display: flex; justify-content: space-between; align-items: center; }
    .body { white-space: pre-wrap; word-break: break-word; margin-top: 0.25rem; }
    .delete button {
      font-size: 0.75rem;
      background: none;
      border: none;
      cursor: pointer;
      opacity: 0.5;
      padding: 0;
    }
    .delete button:hover { opacity: 1; }
    .empty { opacity: 0.5; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>検索</h1>
  <div class="nav"><a href="/">← 日乗</a></div>

  <form class="search" action="/search" method="get">
    <input type="search" name="q" value="{{ q }}" autofocus placeholder="検索">
  </form>

  {% if q %}
    {% if entries %}
    <p class="count">{{ entries | length }}件</p>
    {% include "_entries.html" %}
    {% else %}
    <p class="empty">見つかりませんでした。</p>
    {% endif %}
  {% endif %}
</body>
</html>
